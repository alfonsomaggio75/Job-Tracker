<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Pronunciation Tutor</title>
    <style>
        /* Stili di base e Responsive (invariati) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }

        /* Selettore della voce */
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
            background-color: #fff;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            flex-grow: 1;
            text-align: center;
        }

        button:hover {
            background-color: #0056b3;
        }

        button.secondary {
            background-color: #6c757d;
        }

        button.secondary:hover {
            background-color: #5a6268;
        }

        #text-display {
            font-size: 22px;
            line-height: 1.6;
            padding: 20px;
            border: 1px dashed #ccc;
            border-radius: 5px;
            background: #fafafa;
            min-height: 100px;
        }

        .highlight {
            background-color: #ffeb3b;
            border-radius: 3px;
            transition: background-color 0.2s;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>1. Ascolta e Leggi</h2>
        <textarea id="text-input" placeholder="Incolla qui il tuo testo in inglese...">This is an example text. We are building a great application to practice English pronunciation. Check out the different voices available in your browser!</textarea>
        
        <label for="voice-select">Scegli una voce professionale:</label>
        <select id="voice-select">
            <option value="">Caricamento voci in corso...</option>
        </select>

        <div class="controls">
            <div style="display: flex; align-items: center; gap: 10px; width: 100%;">
                <label for="speed">Velocità:</label>
                <input type="range" id="speed" min="0.5" max="1.5" step="0.1" value="1" style="flex-grow: 1;">
                <span id="speed-value" style="min-width: 30px;">1x</span>
            </div>
            
            <button onclick="startOrRestartReading()">Avvia / Riavvia</button>
            <button id="btn-pause" class="secondary" onclick="togglePause()">Pausa</button>
            <button class="secondary" onclick="skipWords(-10)">⏪ -5 sec</button>
            <button class="secondary" onclick="skipWords(10)">+5 sec ⏩</button>
        </div>

        <div id="text-display">Il testo apparirà qui...</div>
    </div>

    <script>
        const speedInput = document.getElementById('speed');
        const speedValue = document.getElementById('speed-value');
        const btnPause = document.getElementById('btn-pause');
        const displayArea = document.getElementById('text-display');
        const voiceSelect = document.getElementById('voice-select');
        
        let wordsArray = [];
        let globalWordIndex = 0; 
        let isPaused = false;
        let availableVoices = []; // Conterrà l'elenco delle voci

        // Aggiorna etichetta velocità
        speedInput.addEventListener('input', function() {
            speedValue.textContent = this.value + 'x';
        });

        // FUNZIONE NUOVA: Carica le voci disponibili nel browser
        function populateVoiceList() {
            availableVoices = window.speechSynthesis.getVoices();
            
            // Filtriamo solo le voci in inglese (en-US, en-GB, ecc.)
            const englishVoices = availableVoices.filter(voice => voice.lang.includes('en'));
            
            voiceSelect.innerHTML = ''; // Svuota il menu a tendina
            
            if (englishVoices.length === 0) {
                const option = document.createElement('option');
                option.textContent = "Nessuna voce inglese trovata nel sistema.";
                voiceSelect.appendChild(option);
                return;
            }

            // Aggiungiamo le voci al menu a tendina
            englishVoices.forEach((voice) => {
                const option = document.createElement('option');
                // Mostriamo il nome della voce. Spesso le voci migliori hanno "Google" o "Online" nel nome.
                option.textContent = `${voice.name} (${voice.lang})`;
                option.setAttribute('data-name', voice.name);
                voiceSelect.appendChild(option);
            });
        }

        // I browser caricano le voci in modo asincrono, dobbiamo assicurarci di catturarle quando sono pronte
        populateVoiceList();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoiceList;
        }

        // Avvio Lettura
        function startOrRestartReading() {
            const text = document.getElementById('text-input').value;
            if (!text.trim()) return alert("Inserisci un testo!");

            window.speechSynthesis.cancel();
            
            wordsArray = text.split(/\s+/);
            displayArea.innerHTML = '';
            
            wordsArray.forEach((word, index) => {
                const span = document.createElement('span');
                span.id = 'word-' + index;
                span.innerText = word + ' ';
                displayArea.appendChild(span);
            });

            isPaused = false;
            btnPause.innerText = "Pausa";
            globalWordIndex = 0;
            
            readFromIndex(0);
        }

        // Lettura dall'indice
        function readFromIndex(startIndex) {
            window.speechSynthesis.cancel();

            const remainingWords = wordsArray.slice(startIndex);
            if (remainingWords.length === 0) return;

            const textToSpeak = remainingWords.join(' ');
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            
            // ASSEGNAZIONE DELLA VOCE SCELTA:
            // Troviamo la voce selezionata nel menu a tendina e la applichiamo all'utterance
            if (voiceSelect.selectedOptions.length > 0) {
                const selectedVoiceName = voiceSelect.selectedOptions[0].getAttribute('data-name');
                const chosenVoice = availableVoices.find(voice => voice.name === selectedVoiceName);
                if (chosenVoice) {
                    utterance.voice = chosenVoice;
                }
            }

            utterance.lang = 'en-US'; // Fallback
            utterance.rate = parseFloat(speedInput.value);

            let localIndexCount = 0;

            utterance.onboundary = function(event) {
                if (event.name === 'word') {
                    document.querySelectorAll('.highlight').forEach(s => s.classList.remove('highlight'));

                    globalWordIndex = startIndex + localIndexCount;
                    
                    const currentSpan = document.getElementById('word-' + globalWordIndex);
                    if (currentSpan) {
                        currentSpan.classList.add('highlight');
                    }
                    localIndexCount++;
                }
            };

            utterance.onend = function() {
                document.querySelectorAll('.highlight').forEach(s => s.classList.remove('highlight'));
            };

            window.speechSynthesis.speak(utterance);
        }

        // Pausa
        function togglePause() {
            if (window.speechSynthesis.speaking) {
                if (isPaused) {
                    window.speechSynthesis.resume();
                    isPaused = false;
                    btnPause.innerText = "Pausa";
                } else {
                    window.speechSynthesis.pause();
                    isPaused = true;
                    btnPause.innerText = "Riprendi";
                }
            }
        }

        // Salto Temporale
        function skipWords(offset) {
            if (wordsArray.length === 0) return;

            isPaused = false;
            btnPause.innerText = "Pausa";
            
            let newIndex = globalWordIndex + offset;
            
            if (newIndex < 0) newIndex = 0;
            if (newIndex >= wordsArray.length) newIndex = wordsArray.length - 1;
            
            globalWordIndex = newIndex;
            readFromIndex(globalWordIndex);
        }
    </script>
</body>
</html>
