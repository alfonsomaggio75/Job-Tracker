<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Pronunciation Tutor</title>
    <style>
        /* Stili di base */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box; /* Aiuta a mantenere il layout nei margini */
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box; /* Evita che la textarea esca dal contenitore su mobile */
        }

        /* Contenitore dei controlli flessibile */
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap; /* Permette agli elementi di andare a capo su schermi piccoli */
            margin-bottom: 20px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            flex-grow: 1; /* Su mobile i pulsanti si allargheranno per riempire lo spazio */
            text-align: center;
        }

        button:hover {
            background-color: #0056b3;
        }

        button.secondary {
            background-color: #6c757d;
        }

        button.secondary:hover {
            background-color: #5a6268;
        }

        #text-display {
            font-size: 22px;
            line-height: 1.6;
            padding: 20px;
            border: 1px dashed #ccc;
            border-radius: 5px;
            background: #fafafa;
            min-height: 100px;
        }

        .highlight {
            background-color: #ffeb3b;
            border-radius: 3px;
            transition: background-color 0.2s;
        }

        /* REGOLA RESPONSIVE PER SMARTPHONE */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .controls {
                flex-direction: column; /* Mette i controlli in colonna su schermi piccoli */
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>1. Ascolta e Leggi</h2>
        <textarea id="text-input" placeholder="Incolla qui il tuo testo in inglese...">This is an example text. We are building a great application to practice English pronunciation. This app will be responsive and very easy to use on mobile phones!</textarea>
        
        <div class="controls">
            <div style="display: flex; align-items: center; gap: 10px; width: 100%;">
                <label for="speed">Velocità:</label>
                <input type="range" id="speed" min="0.5" max="1.5" step="0.1" value="1" style="flex-grow: 1;">
                <span id="speed-value" style="min-width: 30px;">1x</span>
            </div>
            
            <button onclick="startOrRestartReading()">Avvia / Riavvia</button>
            <button id="btn-pause" class="secondary" onclick="togglePause()">Pausa</button>
            <button class="secondary" onclick="skipWords(-10)">⏪ -5 sec</button>
            <button class="secondary" onclick="skipWords(10)">+5 sec ⏩</button>
        </div>

        <div id="text-display">Il testo apparirà qui...</div>
    </div>

    <script>
        const speedInput = document.getElementById('speed');
const speedValue = document.getElementById('speed-value');
const btnPause = document.getElementById('btn-pause');
const displayArea = document.getElementById('text-display');

let wordsArray = [];
let globalWordIndex = 0; 
let isPaused = false;
let bestEnglishVoice = null; // Variabile per salvare la voce migliore

// 1. NOVITÀ: Funzione per caricare e trovare la voce migliore
function loadVoices() {
    const voices = window.speechSynthesis.getVoices();
    
    // Cerchiamo una voce inglese. Diamo priorità a quelle di Google o quelle Premium/Online
    bestEnglishVoice = voices.find(voice => voice.lang.includes('en-US') && voice.name.includes('Google')) ||
                       voices.find(voice => voice.lang.includes('en-US') && voice.name.includes('Premium')) ||
                       voices.find(voice => voice.lang.includes('en-US') && voice.name.includes('Online')) ||
                       voices.find(voice => voice.lang.includes('en-US')); // Se non trova le prime, prende la prima inglese disponibile
                       
    console.log("Voce selezionata:", bestEnglishVoice ? bestEnglishVoice.name : "Nessuna voce trovata");
}

// I browser caricano le voci in modo asincrono, dobbiamo aspettare che siano pronte
window.speechSynthesis.onvoiceschanged = loadVoices;

speedInput.addEventListener('input', function() {
    speedValue.textContent = this.value + 'x';
});

function startOrRestartReading() {
    const text = document.getElementById('text-input').value;
    if (!text.trim()) return alert("Inserisci un testo!");

    // Assicuriamoci di avere le voci caricate (utile se clicchi subito)
    if (!bestEnglishVoice) loadVoices();

    window.speechSynthesis.cancel();
    
    wordsArray = text.split(/\s+/);
    displayArea.innerHTML = '';
    
    wordsArray.forEach((word, index) => {
        const span = document.createElement('span');
        span.id = 'word-' + index;
        span.innerText = word + ' ';
        displayArea.appendChild(span);
    });

    isPaused = false;
    btnPause.innerText = "Pausa";
    globalWordIndex = 0;
    
    readFromIndex(0);
}

function readFromIndex(startIndex) {
    window.speechSynthesis.cancel();

    const remainingWords = wordsArray.slice(startIndex);
    if (remainingWords.length === 0) return;

    const textToSpeak = remainingWords.join(' ');
    const utterance = new SpeechSynthesisUtterance(textToSpeak);
    
    // 2. NOVITÀ: Assegniamo la voce migliore che abbiamo trovato!
    if (bestEnglishVoice) {
        utterance.voice = bestEnglishVoice;
    } else {
        utterance.lang = 'en-US'; // Fallback di sicurezza
    }
    
    utterance.rate = parseFloat(speedInput.value);

    let localIndexCount = 0;

    utterance.onboundary = function(event) {
        if (event.name === 'word') {
            document.querySelectorAll('.highlight').forEach(s => s.classList.remove('highlight'));
            globalWordIndex = startIndex + localIndexCount;
            const currentSpan = document.getElementById('word-' + globalWordIndex);
            if (currentSpan) {
                currentSpan.classList.add('highlight');
            }
            localIndexCount++;
        }
    };

    utterance.onend = function() {
        document.querySelectorAll('.highlight').forEach(s => s.classList.remove('highlight'));
    };

    window.speechSynthesis.speak(utterance);
}

function togglePause() {
    if (window.speechSynthesis.speaking) {
        if (isPaused) {
            window.speechSynthesis.resume();
            isPaused = false;
            btnPause.innerText = "Pausa";
        } else {
            window.speechSynthesis.pause();
            isPaused = true;
            btnPause.innerText = "Riprendi";
        }
    }
}

function skipWords(offset) {
    if (wordsArray.length === 0) return;

    isPaused = false;
    btnPause.innerText = "Pausa";
    
    let newIndex = globalWordIndex + offset;
    
    if (newIndex < 0) newIndex = 0;
    if (newIndex >= wordsArray.length) newIndex = wordsArray.length - 1;
    
    globalWordIndex = newIndex;
    readFromIndex(globalWordIndex);
}

    </script>
</body>
</html>
