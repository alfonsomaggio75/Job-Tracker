<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Pronunciation Tutor</title>
    <style>
        /* Stili di base per rendere l'app carina e ordinata */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* Il contenitore dove il testo verrà mostrato parola per parola */
        #text-display {
            font-size: 24px;
            line-height: 1.5;
            padding: 20px;
            border: 1px dashed #ccc;
            border-radius: 5px;
            background: #fafafa;
            min-height: 100px;
        }

        /* Classe per evidenziare la parola che viene letta */
        .highlight {
            background-color: #ffeb3b; /* Giallo brillante */
            border-radius: 3px;
            transition: background-color 0.2s;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>1. Ascolta e Leggi</h2>
        <textarea id="text-input" placeholder="Incolla qui il tuo testo in inglese..."></textarea>
        
        <div class="controls">
            <label for="speed">Velocità:</label>
            <input type="range" id="speed" min="0.5" max="1.5" step="0.1" value="1">
            <span id="speed-value">1x</span>
            
            <button onclick="startReading()">Ascolta il testo</button>
        </div>

        <div id="text-display">Il testo apparirà qui...</div>
    </div>

    <script>
        // Aggiorna l'etichetta della velocità quando muovi lo slider
        const speedInput = document.getElementById('speed');
        const speedValue = document.getElementById('speed-value');
        
        speedInput.addEventListener('input', function() {
            speedValue.textContent = this.value + 'x';
        });

        // Funzione principale per leggere il testo
        function startReading() {
            const text = document.getElementById('text-input').value;
            const displayArea = document.getElementById('text-display');
            
            if (!text.trim()) {
                alert("Per favore, inserisci un testo prima di iniziare.");
                return;
            }

            // Prepariamo l'area di visualizzazione: dividiamo il testo in parole
            // e mettiamo ogni parola in uno <span> per poterla colorare singolarmente
            const words = text.split(/\s+/); // Divide per spazi
            displayArea.innerHTML = '';
            
            words.forEach((word, index) => {
                const span = document.createElement('span');
                span.id = 'word-' + index;
                span.innerText = word + ' '; // Aggiunge lo spazio dopo la parola
                displayArea.appendChild(span);
            });

            // Fermiamo eventuali letture precedenti
            window.speechSynthesis.cancel();

            // Configuriamo la voce del computer
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US'; // Impostiamo l'inglese americano
            utterance.rate = parseFloat(speedInput.value); // Prendiamo la velocità dallo slider

            let currentWordIndex = 0;

            // L'evento 'boundary' scatta quando inizia a leggere una nuova parola
            utterance.onboundary = function(event) {
                if (event.name === 'word') {
                    // Rimuove l'evidenziazione da tutte le parole
                    const allSpans = displayArea.querySelectorAll('span');
                    allSpans.forEach(s => s.classList.remove('highlight'));

                    // Evidenzia la parola corrente
                    const currentSpan = document.getElementById('word-' + currentWordIndex);
                    if (currentSpan) {
                        currentSpan.classList.add('highlight');
                    }
                    currentWordIndex++;
                }
            };

            // Avviamo la lettura
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
